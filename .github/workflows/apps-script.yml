# Envia o apps-script/ para o Apps Script e publica uma nova versão na mesma implantação
# (o endereço /exec do config.js não muda). Roda sozinho quando algo em apps-script/ muda na main.
name: Atualizar Apps Script

on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.clasp.json']
  workflow_dispatch:

concurrency: apps-script

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Login do clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Falta o segredo CLASPRC_JSON (veja o LEIA-ME)."; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Enviar o código
        run: npx --yes @google/clasp@3.4.1 push --force

      - name: Publicar nova versão
        run: |
          # O ID da implantação é o trecho do endereço do config.js entre /s/ e /exec.
          ID=$(grep -o 'macros/s/[^/]*/exec' config.js | cut -d/ -f3)
          if [ -z "$ID" ]; then echo "::error::Não achei o endereço /exec no config.js."; exit 1; fi
          npx --yes @google/clasp@3.4.1 deploy -i "$ID" -d "GitHub ${GITHUB_SHA::7}"
